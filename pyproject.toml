[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auroraviz"
version = "0.2.0"
description = "A world-class Python visualization framework with WASM HTML export and WebGL point-cloud rendering."
readme = "README.md"
authors = [{ name = "Gyanankur Baruah", email = "gyanankur9@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "jinja2>=3.1",
    "ipython>=8.0",
]
keywords = [
    "visualization", "charts", "matplotlib", "webgl", "wasm",
    "data viz", "interactive", "echarts", "point-cloud",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/gyanankur/auroraviz"
Repository = "https://github.com/gyanankur/auroraviz"
Issues = "https://github.com/gyanankur/auroraviz/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"auroraviz" = ["styles/*.mplstyle"]
